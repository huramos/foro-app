<div class="container mt-5">
  <div class="card p-4">
    <h2 class="text-center">Recuperación de contraseña</h2>

    <form [formGroup]="passwordResetForm" (ngSubmit)="onResetSubmit()">
      <div class="form-group">
        <label for="email">Correo electrónico:</label>
        <input type="email" id="email" class="form-control" formControlName="email" autocomplete="off">
        <small class="text-danger" *ngIf="passwordResetForm.controls['email'].invalid && passwordResetForm.controls['email'].touched">
          Debes ingresar un correo válido.
        </small>
      </div>

      <button class="btn btn-primary w-100 mt-3" type="submit">Recuperar Contraseña</button>
    </form>

    <div *ngIf="passwordVisible && recoveredPassword" class="alert alert-success mt-4">
      <p>Contraseña recuperada correctamente:</p>
      <input class="form-control mt-2" [value]="recoveredPassword" readonly type="text">
      <button class="btn btn-outline-secondary mt-2" (click)="copyPassword()">Copiar</button>
    </div>

    <p *ngIf="recoveryMessage" class="mt-4 text-danger">{{ recoveryMessage }}</p>

    <button class="btn btn-secondary w-100 mt-2" (click)="onBack()">Volver</button>
  </div>
</div>
