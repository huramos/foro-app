<div class="container mt-5">
  <div class="card p-4">
    <h2 class="text-center">Registro de usuario</h2>

    <!-- Se agrega autocomplete="off" y novalidate para evitar autocompletado -->
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" type="text" class="form-control" formControlName="username" autocomplete="off">
        <small class="text-danger" *ngIf="registerForm.controls['username'].invalid && registerForm.controls['username'].touched">
          El usuario debe tener al menos 4 caracteres.
        </small>
      </div>

      <div class="form-group mt-3">
        <label for="email">Correo Electrónico</label>
        <input id="email" type="email" class="form-control" formControlName="email" autocomplete="off">
        <small class="text-danger" *ngIf="registerForm.controls['email'].invalid && registerForm.controls['email'].touched">
          Ingresa un correo válido.
        </small>
      </div>

      <div class="form-group mt-3">
        <label for="password">Contraseña</label>
        <!-- Se usa "new-password" para evitar la sugerencia del navegador -->
        <input id="password" type="password" class="form-control" formControlName="password" autocomplete="new-password">
        <small class="text-danger" *ngIf="registerForm.controls['password'].invalid && registerForm.controls['password'].touched">
          La contraseña debe tener al menos 8 caracteres, una mayúscula, una minúscula, un número y un carácter especial.
        </small>
      </div>

      <div class="form-group mt-3">
        <label for="gender">Género</label>
        <select id="gender" class="form-control" formControlName="gender">
          <option value="">Seleccione una opción</option>
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
        </select>
        <small class="text-danger" *ngIf="registerForm.controls['gender'].invalid && registerForm.controls['gender'].touched">
          Seleccione un género.
        </small>
      </div>

      <button class="btn btn-primary w-100 mt-4" type="submit" [disabled]="registerForm.invalid">Registrarse</button>
    </form>

    <p class="text-success mt-3">{{ registrationMessage }}</p>
    <p class="text-danger mt-3">{{ errorMessage }}</p> <!-- Muestra errores si el registro falla -->

    <button class="btn btn-secondary w-100 mt-2" (click)="onLogin()">Volver al login</button>
  </div>
</div>
