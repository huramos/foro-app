<div class="container mt-5">
  <div class="card p-4">
    <h2 class="text-center">Bienvenido, {{ userData.username }}</h2>

    <form [formGroup]="profileForm" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" class="form-control" formControlName="username" readonly>
      </div>

      <div class="form-group mt-3">
        <label for="email">Correo Electrónico</label>
        <input id="email" class="form-control" formControlName="email" [readonly]="!isEditing">
      </div>

      <div class="form-group mt-3">
        <label for="gender">Género</label>
        <select id="gender" class="form-control" formControlName="gender" [disabled]="!isEditing">
          <option value="Masculino">Masculino</option>
          <option value="Femenino">Femenino</option>
        </select>
      </div>
    </form>

    <div class="mt-4">
      <button *ngIf="!isEditing" class="btn btn-warning w-100" (click)="toggleEdit()">Editar</button>
      <button *ngIf="isEditing" class="btn btn-success w-100" (click)="saveChanges()">Guardar</button>
      <button class="btn btn-danger w-100 mt-4" (click)="logout()">Salir</button>
    </div>

    <!-- 🔹 Botón para ir al foro -->
    <div class="mt-4 text-center">
      <button class="btn btn-primary" (click)="navigateToForum()">Ir al Foro</button>
    </div>
  </div>
</div>
