<div class="container mt-5">
  <div class="card p-4">
    <h2 class="text-center">Inicio de sesión</h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" autocomplete="off" novalidate>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input id="username" type="text" class="form-control" formControlName="username" autocomplete="off">
        <small class="text-danger" *ngIf="loginForm.controls['username'].invalid && loginForm.controls['username'].touched">
          El usuario es obligatorio.
        </small>
      </div>

      <div class="form-group mt-3">
        <label for="password">Contraseña</label>
        <input id="password" type="password" class="form-control" formControlName="password" autocomplete="new-password">
        <small class="text-danger" *ngIf="loginForm.controls['password'].invalid && loginForm.controls['password'].touched">
          La contraseña es obligatoria y debe tener al menos 8 caracteres.
        </small>
      </div>

      <button class="btn btn-primary w-100 mt-4" type="submit" [disabled]="loginForm.invalid">Iniciar sesión</button>
    </form>

    <p class="text-danger mt-3">{{ errorMessage }}</p> <!-- Muestra mensajes de error si el login falla -->

    <button class="btn btn-secondary w-100 mt-2" (click)="onRegister()">Registrarse</button>
    <button class="btn btn-link w-100 mt-2" (click)="onForgotPassword()">¿Olvidaste tu contraseña?</button>
  </div>
</div>
